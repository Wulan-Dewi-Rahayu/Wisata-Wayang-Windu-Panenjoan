<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservasi Wayang Windu Panenjoan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

      <div class="wwppesan">
      <h2>Formulir Reservasi Wayang Windu Panenjoan</h2>
      <nav>
      <a href="index.html">Home</a>
      </nav>
      
      <form id="wwpForm">
      
      <input type="hidden" name="id_partner" value="WWP2026">
      
      <section>
      <h3>Identitas Pemesan</h3>
      
      <label>Nama Lengkap</label>
      <input type="text" name="nama" required>
      
      <label>Buat PIN (6 digit)</label>
      <input type="password" name="pin" pattern="[0-9]{6}" placeholder="6 digit angka" required>
      
      <label>Email</label>
      <input type="email" name="email" required>
      
      <label>Nomor WhatsApp</label>
      <input type="tel" name="wa" required>
      </section>
      
      <section>
      <h3>Detail Perjalanan</h3>
      
      <label>Cari Paket (Search)</label>
      <input type="search" name="paket" placeholder="Contoh: Paket Camping">
      
      <label>Tanggal Keberangkatan</label>
      <input type="date" name="tanggal" required>
      
      <label>Jam Kumpul</label>
      <input type="time" name="jam" required>
      
      <label>Jumlah Peserta (1-50 orang)</label>
      <input type="number" name="peserta" min="1" max="50" required>
      </section>

<section>
<h3>Lokasi Penjemputan</h3>

    <div class="form-group">
      <label for="desa">Desa/Kelurahan:</label>
      <select name="desa" id="desa">
        <option value="Cipada">Cipada</option>
        <option value="Jambudipa">Jambudipa</option>
        <option value="Kertawangi">Kertawangi</option>
        <option value="Padaasih">Padaasih</option>
        <option value="Pasirhalang">Pasirhalang</option>
        <option value="Pasirlangu">Pasirlangu</option>
        <option value="Sadangmekar">Sadangmekar</option>
        <option value="Tugumukti">Tugumukti</option>
      </select>
    </div>

    <div class="form-group">
      <label for="kecamatan">Kecamatan:</label>
      <select name="kecamatan" id="kecamatan">
        <option value="Batujajar">Batujajar</option>
        <option value="Cihampelas">Cihampelas</option>
        <option value="Cikalongwetan">Cikalongwetan</option>
        <option value="Cililin">Cililin</option>
        <option value="Cipatat">Cipatat</option>
        <option value="Cipeundeuy">Cipeundeuy</option>
        <option value="Cipongkor">Cipongkor</option>
        <option value="Cisarua">Cisarua</option>
      </select>
    </div>

    <div class="form-group">
      <label for="kab">Kabupaten/Kota:</label>
      <select name="kab" id="kab">
        <option value="Kabupaten Bandung">Kabupaten Bandung</option>
        <option value="Kabupaten Bandung Barat">Kabupaten Bandung Barat</option>
        <option value="Kabupaten Bogor">Kabupaten Bogor</option>
        <option value="Kabupaten Bekasi">Kabupaten Bekasi</option>
        <option value="Kabupaten Cianjur">Kabupaten Cianjur</option>
        <option value="Kota Bandung">Kota Bandung</option>
        <option value="Kota Banjar">Kota Banjar</option>
        <option value="Kota Bogor">Kota Bogor</option>
        <option value="Kota Bekasi">Kota Bekasi</option>
        <option value="Kota Cimahi">Kota Cimahi</option>
      </select>
    </div>
      
      <label>Meeting Point</label>
        <select name="meeting">
      <option>Terminal Pangalengan</option>
      <option>Stasiun Bandung</option>
      <option>Alun-Alun Bandung</option>
      </select>
      </section>
      
      <section>
      <h3>Preferensi Personal</h3>
      
      <label>Link Media Sosial (URL)</label>
      <input type="url" name="sosmed" placeholder="https://instagram.com/...">
      
      <label>Pilih Warna Seragam Grup</label>
      <input type="color" name="warna" value="#2e7d32">
      </section>

<section>
<h3>Opsi Tambahan</h3>

<label>Metode Pembayaran</label><br>
<input type="radio" name="bayar" value="Full Payment" checked> Full Payment
<input type="radio" name="bayar" value="DP 50%"> DP 50%
<br><br>

<label>Fasilitas Ekstra</label><br>
<input type="checkbox" name="ekstra" value="Bike Trek"> Bike Trek
<input type="checkbox" name="ekstra" value="Sewa Kamera"> Sewa Kamera
<br><br>

<label>Upload KTP/Paspor</label>
<input type="file" name="dokumen">
</section>

<section>
<input type="submit" value="Kirim Reservasi">
<input type="reset" value="Reset Form">
</section>

<div id="result"></div>

</div>

<script>
document.getElementById("wwpForm").addEventListener("submit", function(e){
  e.preventDefault();

  const data = new FormData(this);
  let output = "<h3>Reservasi Berhasil!</h3><ul>";

  data.forEach((value, key)=>{
    output += "<li><strong>"+key+"</strong>: "+value+"</li>";
  });

  output += "</ul>";

  document.getElementById("result").innerHTML = output;
  document.getElementById("result").style.display = "block";

  localStorage.setItem("reservasiWWP", JSON.stringify(Object.fromEntries(data)));

  alert("Terima kasih! Pemesanan berhasil.");
});
</script>

</body>
</html>
